<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 606 266" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Arth Technology</title>
  <desc id="logoDesc">Arth Technology logo with hexagon icon, ARTH wordmark, Technology text and Think Build Grow tagline.</desc>
  <defs>
    <style>
      .navy{fill:#061a3d}
      .gold{fill:#df981f}
      .line-navy{stroke:#061a3d}
      .line-gold{stroke:#df981f}
      .word{font-family:Montserrat,Poppins,Arial,sans-serif;font-weight:900}
      .sub{font-family:Montserrat,Poppins,Arial,sans-serif;font-weight:800}
    </style>
  </defs>

  <rect width="606" height="266" fill="none"/>

  <g id="arth-icon" transform="translate(18 24)">
    <g fill="none" stroke-linecap="butt" stroke-linejoin="miter">
      <path class="line-navy" d="M77 25 45 44" stroke-width="9"/>
      <path class="line-navy" d="M104 25 138 45" stroke-width="9"/>
      <path class="line-navy" d="M24 70v39" stroke-width="9"/>
      <path class="line-navy" d="M157 70v39" stroke-width="9"/>
      <path class="line-navy" d="M44 134 77 153" stroke-width="9"/>
      <path class="line-navy" d="M138 134 104 153" stroke-width="9"/>
    </g>

    <circle class="gold" cx="91" cy="15" r="14"/>
    <circle class="gold" cx="16" cy="59" r="14"/>
    <circle class="gold" cx="166" cy="59" r="14"/>
    <circle class="gold" cx="16" cy="120" r="14"/>
    <circle class="gold" cx="166" cy="120" r="14"/>
    <circle class="gold" cx="91" cy="165" r="14"/>

    <path class="navy" d="M34 131 77 39h29l43 92h-30l-27-62-28 62H34Z"/>
    <path fill="#fff" d="M80 95h25l-12-28-13 28Z"/>
    <path class="gold" d="M62 92h63v18H104v55H83v-55H62V92Z"/>
  </g>

  <g id="arth-wordmark" transform="translate(235 47)">
    <text class="word navy" x="0" y="84" font-size="78" letter-spacing="5">ARTH</text>
    <text class="sub gold" x="2" y="137" font-size="39" letter-spacing="8">TECHNOLOGY</text>
    <path class="line-gold" d="M2 154h348" stroke-width="3"/>
    <text class="sub navy" x="2" y="194" font-size="22" letter-spacing="10">THINK. BUILD. GROW.</text>
  </g>
</svg>
